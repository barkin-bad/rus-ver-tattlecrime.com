<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eyes {
            display: flex;
            gap: 80px;
        }

        .eye {
            width: 120px;
            height: 120px;
            background: #fff;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
    </div>
</body>
</html>
