<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eyes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .eyes-container {
            display: flex;
            gap: 80px;
            position: relative;
        }

        .eye {
            width: 120px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
 
            animation: blink 4.5s ease-in-out infinite;
        }

        .pupil {
            width: 50px;
            height: 50px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes blink {
            0%,
            100% {
                transform: scaleY(1);
            }
            94% {
                transform: scaleY(1);
            }
            96% {
                transform: scaleY(0.04);
            }
            98% {
                transform: scaleY(0.04);
            }
            100% {
                transform: scaleY(1);
            }
        }

        .eye:nth-child(1) .pupil {
            animation: look1 6s ease-in-out infinite;
        }

        .eye:nth-child(2) .pupil {
            animation: look2 6s ease-in-out infinite;
        }

        @keyframes look1 {
            0%,
            100% {
                transform: translate(-50%, -50%);
            }
            25% {
                transform: translate(-40%, -55%);
            }
            50% {
                transform: translate(-55%, -45%);
            }
            75% {
                transform: translate(-45%, -60%);
            }
        }

        @keyframes look2 {
            0%,
            100% {
                transform: translate(-50%, -50%);
            }
            25% {
                transform: translate(-60%, -45%);
            }
            50% {
                transform: translate(-40%, -55%);
            }
            75% {
                transform: translate(-55%, -40%);
            }
        }

    
        .eye,
        .pupil {
            box-shadow: none;
            filter: none;
            border: none;
            outline: none;
        }

        @media (max-width: 480px) {
            .eyes-container {
                gap: 40px;
            }
            .eye {
                width: 80px;
                height: 54px;
            }
            .pupil {
                width: 34px;
                height: 34px;
            }
        }
    </style>
</head>
<body>

    <div class="eyes-container">
        <div class="eye">
            <div class="pupil"></div>
        </div>
        <div class="eye">
            <div class="pupil"></div>
        </div>
    </div>

</body>
</html>
